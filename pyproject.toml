[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mogua"
version = "1.0.0"
description = "Lightweight, grounded citation-network crawler and literature map generator (Connected Papers alternative & AI Agent Skill)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Mogua Contributors" }
]
keywords = [
  "citation-network",
  "literature-review",
  "connected-papers",
  "openalex",
  "snowballing",
  "academic-graph",
  "agent-skill"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "networkx>=3.0",
  "pyvis>=0.3",
  "requests>=2.31",
  "scipy>=1.10",
]

[tool.setuptools]
py-modules = ["run_pipeline", "pipeline_modules", "enrich_abstracts"]

[project.scripts]
mogua = "run_pipeline:main"

[dependency-groups]
dev = ["pytest>=8"]
